[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "creative-intelligence"
version = "1.0.0"
description = "Engenharia reversa criativa e avaliação preditiva opcional para motores de vídeo (sem dependências; usa FFmpeg)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
teste = ["pytest>=8"]

[project.scripts]
ci = "creative_intelligence.cli:main"

[tool.setuptools]
packages = ["creative_intelligence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
