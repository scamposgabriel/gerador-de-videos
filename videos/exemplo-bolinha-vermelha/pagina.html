<script>
"use strict";

const lerp = (a, b, p) => a + (b - a) * p;
const easeOut = (p) => 1 - Math.pow(1 - clamp(p), 3);

function sorte(seed) { return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);

  if (html != null) e.innerHTML = html; if (pai) pai.appendChild(e); return e; }

const L = "#22160F", AZUL = "#13294B", LARANJA = "#FF6B4A", VERM = "#E8322B", BAZUL = "#2F6FE0", VERDE = "#3DBA3A";
const ZE_W = 941, ZE_H = 1672;   // tamanho das poses: PNG do seu personagem (PERSONAGEM no roteiro) ou o Lumi em SVG

// ---- personagem padrão: o Lumi (uma lâmpada), desenhado aqui mesmo no tamanho das poses (941 x 1672). As mãos ficam nos mesmos
// pontos que as cenas usam: palma direita do "apresentando" ~(850, 580), palma esquerda ~(90, 830). Poses: apresentando, apontando,
// olha-so, pensando, rindo, surpreso. Para usar o SEU personagem: PNGs transparentes com esses nomes e as mãos nesses pontos.
const LUMI = { camisa: "#FF6B4A", calca: "#13294B", vidro1: "#FFF8D2", vidro2: "#FFE066", rosca: "#B9C3CF", boca: "#7A1F2B" };
const BRACOS = {   // [ombro, ponto de curva, mão, dedo?, ângulo do dedo]

  apontando: { d: [[595, 850], [740, 700], [855, 585], 1, -8], e: [[345, 850], [240, 960], [300, 1050]] },
  "olha-so": { d: [[595, 850], [820, 720], [760, 360], 1, -90], e: [[345, 850], [240, 960], [300, 1050]] },
  pensando: { d: [[595, 850], [770, 830], [625, 705]], e: [[345, 850], [240, 960], [300, 1050]] },
  rindo: { d: [[595, 850], [760, 700], [845, 565], 1, -15], e: [[345, 850], [300, 1010], [455, 1010]] },
  surpreso: { d: [[595, 850], [890, 660], [790, 330]], e: [[345, 850], [50, 660], [150, 330]] },

let NL = 0;
function desenharLumi(s, pose) {
  const id = "lumi" + NL++, g = svg("g", { "stroke-linejoin": "round", "stroke-linecap": "round" }, s), sw = 14;
  const rg = svg("radialGradient", { id, cx: 0.38, cy: 0.32, r: 0.75 }, svg("defs", {}, s));
  svg("stop", { offset: 0, "stop-color": LUMI.vidro1 }, rg); svg("stop", { offset: 1, "stop-color": LUMI.vidro2 }, rg);
  [[372, 452], [490, 570]].forEach(([a, b]) => svg("rect", { x: a, y: 1140, width: b - a, height: 400, rx: 38, fill: LUMI.calca, stroke: L, "stroke-width": sw }, g));
  [[402, 1570], [550, 1570]].forEach(([cx, cy]) => { svg("ellipse", { cx, cy, rx: 94, ry: 48, fill: "#FFFFFF", stroke: L, "stroke-width": sw }, g);
    svg("path", { d: `M${cx - 82} ${cy + 16} Q${cx} ${cy + 40} ${cx + 82} ${cy + 16}`, stroke: LUMI.camisa, "stroke-width": 14, fill: "none" }, g); });
  svg("rect", { x: 312, y: 770, width: 316, height: 420, rx: 100, fill: LUMI.camisa, stroke: L, "stroke-width": sw }, g);
  svg("path", { d: "M405 792 L470 858 L535 792", fill: "none", stroke: L, "stroke-width": 11 }, g);
  svg("rect", { x: 368, y: 640, width: 204, height: 150, rx: 26, fill: LUMI.rosca, stroke: L, "stroke-width": sw }, g);
  [684, 724, 764].forEach((y) => svg("line", { x1: 380, y1: y, x2: 560, y2: y, stroke: "#8793A1", "stroke-width": 10 }, g));
  svg("circle", { cx: 470, cy: 390, r: 290, fill: `url(#${id})`, stroke: L, "stroke-width": sw }, g);
  svg("path", { d: "M250 330 A230 230 0 0 1 380 160", stroke: "#FFFFFF", "stroke-width": 26, fill: "none", opacity: 0.85 }, g);
  // rosto
  const E = [[385, 400], [555, 400]];
  if (pose === "rindo") E.forEach(([x, y]) => svg("path", { d: `M${x - 48} ${y + 12} Q${x} ${y - 50} ${x + 48} ${y + 12}`, stroke: L, "stroke-width": 16, fill: "none" }, g));
  else { const k = pose === "surpreso" ? 1.18 : 1, [dx, dy] = ({ pensando: [14, -22], "olha-so": [12, -14], apontando: [16, 0], apresentando: [6, 4] })[pose] || [0, 0];
    E.forEach(([x, y]) => { svg("ellipse", { cx: x, cy: y, rx: 54 * k, ry: 66 * k, fill: "#FFFFFF", stroke: L, "stroke-width": 11 }, g);
      svg("circle", { cx: x + dx, cy: y + dy, r: pose === "surpreso" ? 20 : 27, fill: L }, g); svg("circle", { cx: x + dx + 9, cy: y + dy - 10, r: 8, fill: "#FFFFFF" }, g); }); }
  const sb = ({ surpreso: -40, "olha-so": -14 })[pose] ?? 0;
  E.forEach(([x, y], i) => { const lev = pose === "pensando" && i === 1 ? -26 : sb;
    svg("path", { d: `M${x - 46} ${y - 94 + lev} Q${x} ${y - 120 + lev} ${x + 46} ${y - 94 + lev}`, stroke: L, "stroke-width": 14, fill: "none" }, g); });
  if (pose === "surpreso") svg("ellipse", { cx: 470, cy: 560, rx: 44, ry: 56, fill: LUMI.boca, stroke: L, "stroke-width": 11 }, g);
  else if (pose === "pensando") svg("path", { d: "M420 562 Q470 550 520 574", stroke: L, "stroke-width": 13, fill: "none" }, g);
  else if (pose === "rindo") { svg("path", { d: "M360 500 Q470 520 580 500 Q570 640 470 640 Q370 640 360 500 Z", fill: LUMI.boca, stroke: L, "stroke-width": 11 }, g);
    svg("path", { d: "M412 600 Q470 572 528 600 Q518 634 470 634 Q422 634 412 600 Z", fill: "#FF7B8A" }, g); }
  else { svg("path", { d: "M380 520 Q470 540 560 520 Q545 610 470 612 Q395 610 380 520 Z", fill: LUMI.boca, stroke: L, "stroke-width": 11 }, g);
    svg("path", { d: "M394 526 Q470 543 546 526 L542 548 Q470 561 398 548 Z", fill: "#FFFFFF" }, g); }
  [[330, 505], [610, 505]].forEach(([x, y]) => svg("ellipse", { cx: x, cy: y, rx: 34, ry: 20, fill: "#FF8A7A", opacity: 0.5 }, g));
  // braços (por cima do corpo: as mãos ficam na frente)
  const b = BRACOS[pose] || BRACOS.apresentando;
  [b.e, b.d].forEach(([s0, c, m, dedo, ang]) => { const d = `M${s0[0]} ${s0[1]} Q${c[0]} ${c[1]} ${m[0]} ${m[1]}`;
    svg("path", { d, stroke: L, "stroke-width": 80, fill: "none" }, g); svg("path", { d, stroke: LUMI.camisa, "stroke-width": 54, fill: "none" }, g);
    if (dedo) { const a = (ang * Math.PI) / 180, fx = m[0] + 80 * Math.cos(a), fy = m[1] + 80 * Math.sin(a);
      svg("line", { x1: m[0], y1: m[1], x2: fx, y2: fy, stroke: L, "stroke-width": 46 }, g); svg("line", { x1: m[0], y1: m[1], x2: fx, y2: fy, stroke: "#FFFFFF", "stroke-width": 24 }, g); }
    svg("circle", { cx: m[0], cy: m[1], r: 54, fill: "#FFFFFF", stroke: L, "stroke-width": 12 }, g); });

// avatar da marca (cartão final, capa, etiqueta do topo): imagem de MARCA["avatar"] ou a cabeça do Lumi
function avatar(tam) { const m = DADOS.marca || {};
  if (m.avatar) return `<img src="${m.avatar}" style="width:${tam}px; height:${tam}px; border-radius:50%; object-fit:cover; display:block">`;
  return `<svg width="${tam}" height="${tam}" viewBox="0 0 200 200" style="display:block"><circle cx="100" cy="100" r="100" fill="#FFFFFF"/>
    <rect x="74" y="140" width="52" height="34" rx="9" fill="${LUMI.rosca}" stroke="${L}" stroke-width="6"/>
    <circle cx="100" cy="92" r="62" fill="${LUMI.vidro2}" stroke="${L}" stroke-width="7"/>
    <ellipse cx="82" cy="86" rx="11" ry="14" fill="#fff" stroke="${L}" stroke-width="4"/><ellipse cx="118" cy="86" rx="11" ry="14" fill="#fff" stroke="${L}" stroke-width="4"/>
    <circle cx="84" cy="88" r="6" fill="${L}"/><circle cx="120" cy="88" r="6" fill="${L}"/>
    <path d="M78 110 Q100 128 122 110" stroke="${L}" stroke-width="6" fill="none" stroke-linecap="round"/></svg>`; }
const nomeMarca = () => String((DADOS.marca || {}).nome || "SEU CANAL").toUpperCase();
// mesma matriz do filtro #visaoCao: cor que o cachorro "vê" (aproximação)
const MAT = [0.367322, 0.860646, -0.227968, 0.280085, 0.672501, 0.047413, -0.011820, 0.042940, 0.968881];
function visaoCao(hex) { const n = parseInt(hex.slice(1), 16), c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => v / 255);
  return "#" + [0, 1, 2].map((i) => Math.round(255 * clamp(MAT[i * 3] * c[0] + MAT[i * 3 + 1] * c[1] + MAT[i * 3 + 2] * c[2])).toString(16).padStart(2, "0")).join(""); }

let TL = null, C = {}, EVENTOS = [], A = [], CENAS = [], LEG = [], T = {}, IMGS = [], DADOS = {};
function quando(nome, palavra, n = 1, fr = 0.5) { const c = C[nome]; if (!c) return 0; const alvo = norm(palavra); let k = 0;
  for (const w of c.palavras) if (norm(w.w).startsWith(alvo) && ++k === n) return c.ini + w.t; return c.ini + fr * c.dur; }
function som(t, nome, extra) { EVENTOS.push(Object.assign({ t: +Math.max(0, t).toFixed(3), som: nome }, extra || {})); }
function anim(f) { A.push(f); }
function entra(el, t0, o = {}) {
  const d = o.dur ?? 0.45, dy = o.dy ?? 34, dx = o.dx ?? 0, s0 = o.s0 ?? 0.96, rot = o.rot ?? 0, ease = o.ease ?? easeOut, base = o.base || "";
  anim((t) => { const p = clamp((t - t0) / d), e = ease(p);
    el.style.opacity = p <= 0 ? "0" : Math.min(1, p * 1.8).toFixed(3);
    el.style.transform = `${base} translate(${(dx * (1 - e)).toFixed(1)}px,${(dy * (1 - e)).toFixed(1)}px) scale(${(s0 + (1 - s0) * e).toFixed(4)}) rotate(${(rot * (1 - e)).toFixed(2)}deg)`; });
  if (o.som) som(t0, o.som, { vol: o.vol ?? 0.45, nota: o.nota });
}
function sai(el, t1, d = 0.25) { anim((t) => { const q = clamp((t - t1) / d); if (q > 0) el.style.opacity = (parseFloat(el.style.opacity || 1) * (1 - q)).toFixed(3); }); }
function camera(els, cx, cy, k) { const tr = `translate(${cx},${cy}) scale(${k.toFixed(4)}) translate(${-cx},${-cy})`; els.forEach((e) => e.setAttribute("transform", tr)); }

// ======================================================================= peças
// personagem: troca de pose num instante (com pulinho), respira e balança; "extra" segue o corpo (objetos na mão)
function personagem(pai, x, y, alt, seq, o = {}) {
  const w = alt * ZE_W / ZE_H, s = alt / ZE_H;
  const caixa = h("div", `left:${x}px; top:${y}px; width:${w.toFixed(1)}px; height:${alt}px`, "", pai, "pers");
  const corpo = h("div", "", "", caixa, "corpo"), imgs = {};
  const P = DADOS.personagem || {};
  seq.forEach(([, p]) => { if (imgs[p]) return;
    if (P.pasta) { const im = h("img", "opacity:0", null, corpo); im.src = `${P.pasta}/${P.prefixo ?? ""}${p}.png`; imgs[p] = im; }
    else { const s = svg("svg", { viewBox: `0 0 ${ZE_W} ${ZE_H}` }, corpo); s.style.cssText = "position:absolute; inset:0; width:100%; height:100%; opacity:0; overflow:visible";
      desenharLumi(s, p); imgs[p] = s; } });
  const extra = h("div", "position:absolute; inset:0", "", corpo), fase = o.fase ?? 0;
  const atual = (t) => { let k = 0; seq.forEach(([t0], i) => { if (t >= t0) k = i; }); return k; };
  anim((t) => { const k = atual(t);
    for (const p in imgs) imgs[p].style.opacity = p === seq[k][1] ? "1" : "0";
    const pulo = k > 0 ? Math.sin(Math.PI * clamp((t - seq[k][0]) / 0.3)) : 0, resp = Math.sin(t * 2.4 + fase);
    corpo.style.transform = `translateY(${(-22 * pulo).toFixed(1)}px) rotate(${(1.4 * Math.sin(t * 1.15 + fase)).toFixed(2)}deg) scale(${(1 + 0.045 * pulo + 0.005 * resp).toFixed(4)}, ${(1 - 0.025 * pulo + 0.012 * resp).toFixed(4)})`; });
  seq.forEach(([t0], i) => { if (i > 0) som(t0, "pop", { vol: 0.32 }); });

let NB = 0;
function bola(pai, r, cor) {

  const cp = svg("clipPath", { id }, svg("defs", {}, g)); svg("circle", { r }, cp);
  const dentro = svg("g", { "clip-path": `url(#${id})` }, g);

  svg("circle", { cx: r * 0.42, cy: r * 0.5, r: r * 1.05, fill: "rgba(0,0,0,.2)" }, dentro);
  svg("path", { d: `M${-r},${-r * 0.15} C${-r * 0.35},${r * 0.45} ${r * 0.35},${-r * 0.6} ${r},${r * 0.05}`, stroke: "rgba(255,255,255,.5)", "stroke-width": r * 0.13, fill: "none" }, dentro);
  svg("circle", { r, fill: "none", stroke: L, "stroke-width": Math.max(4, r * 0.11) }, g);
  svg("ellipse", { cx: -r * 0.38, cy: -r * 0.42, rx: r * 0.24, ry: r * 0.15, fill: "rgba(255,255,255,.85)", transform: `rotate(-35 ${-r * 0.38} ${-r * 0.42})` }, g);
  return { g, cor: (c) => corpo.setAttribute("fill", c) };

function bolaDiv(pai, cx, cy, r, cor) {
  const m = r + 8, d = h("div", `position:absolute; left:${(cx - m).toFixed(1)}px; top:${(cy - m).toFixed(1)}px; width:${2 * m}px; height:${2 * m}px`, "", pai);
  const s = svg("svg", { width: 2 * m, height: 2 * m, viewBox: `${-m} ${-m} ${2 * m} ${2 * m}` }, d);

function anel(pai, cx, cy, r, cor = LARANJA) { return svg("circle", { cx, cy, r, fill: "none", stroke: cor, "stroke-width": 10, "stroke-dasharray": "24 14", "stroke-linecap": "round", opacity: 0 }, pai); }
function coracao(pai) { const g = svg("g", { opacity: 0 }, pai);
  svg("path", { d: "M0,18 C-30,-4 -34,-26 -18,-34 C-8,-39 0,-32 0,-24 C0,-32 8,-39 18,-34 C34,-26 30,-4 0,18 Z", fill: "#FF4F6A", stroke: L, "stroke-width": 5, "stroke-linejoin": "round" }, g); return g; }

// gramado: céu, nuvens, morro, arbustos, grama com folhas que balançam; "camadas" = grupos inseridos na profundidade y pedida
let NJ = 0;
function jardim(pai, w, hh, o = {}) {

const COR_PALAVRA = { vermelha: "#FF6A5C", vermelho: "#FF6A5C", verde: "#8BE06A", azul: "#7DB3FF", amarelo: "#FFD21A", cores: "#FFB05C", cor: "#FFB05C" };
function montarLegendas() {
  const pai = document.getElementById("leg");
  for (const c of TL.cenas) {
    const toks = c.fala.split(/\s+/); let j = 0; const ws = [];
    for (const p of c.palavras) { const n = norm(p.w); if (!n) continue;
      let k = j; while (k < toks.length && k < j + 4 && norm(toks[k]) !== n && !norm(toks[k]).startsWith(n)) k++;
      let s = p.w, quebra = false; if (k < toks.length && k < j + 4) { s = toks[k]; quebra = /[,.?!;:]$/.test(toks[k]); j = k + 1; }
      ws.push({ t: c.ini + p.t, d: p.d, s: s.replace(/[,;:.]+$/, ""), n, quebra }); }
    const blocos = []; let gr = []; const letras = (a) => a.reduce((s, x) => s + x.s.length + 1, 0);
    ws.forEach((w, i) => { if (gr.length && letras(gr) + w.s.length > 16) { blocos.push(gr); gr = []; }   // bloco curto: não chega na coluna de botões
      gr.push(w); const prox = ws[i + 1];
      if (w.quebra) { blocos.push(gr); gr = []; return; }
      if (gr.length >= 3 || letras(gr) > 15) { if (prox && prox.quebra && prox.s.length <= 5 && letras(gr) + prox.s.length < 19) return; blocos.push(gr); gr = []; } });
    if (gr.length) blocos.push(gr);
    blocos.forEach((b) => { const g = h("div", "opacity:0", "", pai, "bl"), cx = h("div", "", "", g, "caixa");
      const spans = b.map((w) => { const sp = h("span", "", w.s, cx), cor = COR_PALAVRA[w.n]; if (cor) sp.style.color = cor; return { sp, w, cor }; });
      const larg = cx.getBoundingClientRect().width;     // segurança: legenda nunca passa de 860 px (área livre dos botões do Instagram)
      if (larg > 860) spans.forEach((s) => { s.sp.style.fontSize = `${(74 * 860 / larg).toFixed(1)}px`; });
      const ult = b[b.length - 1]; LEG.push({ g, cx, spans, ini: b[0].t - 0.05, fimFala: ult.t + ult.d + 0.45, cena: c.cena }); });
  }
  LEG.forEach((b, i) => { const prox = LEG[i + 1]; b.fim = prox && prox.cena === b.cena ? prox.ini : Math.min(b.fimFala, C[b.cena].fim - 0.08); });
}
// cartão final curto: pergunta, nome do canal grande, personagem rindo e o cachorro com a bolinha azul
function montarFim() {
  const f = document.getElementById("fim");
  const ov = svg("svg", { width: 1080, height: 1920, viewBox: "0 0 1080 1920" }, f); ov.style.cssText = "position:absolute; left:0; top:0; overflow:visible";
  morro(ov, 33);
  const cao = cachorro(ov), bc = bola(ov, 38, BAZUL);
  anim((t) => { const o = cao.pose({ t, x: 250, y: yMorro(250) + 8, esc: 0.9, face: 1, pulo: -10 * Math.abs(Math.sin(t * 4)), cauda: 22 * Math.sin(t * 15), olhar: 2 });
    bc.g.setAttribute("transform", `translate(${o.boca[0].toFixed(1)},${o.boca[1].toFixed(1)})`); });
  const b1 = h("div", "position:absolute; left:0; right:0; top:280px; text-align:center; font-weight:800; line-height:.9; color:var(--tinta)",
    `<div style="font-size:132px">Você sabia</div><div class="sombra" style="font-size:150px; color:var(--destaque)">disso? <span style="text-shadow:none">🐶</span></div>`, f);
  const b2 = h("div", "position:absolute; left:70px; top:640px", `<span class="av" style="display:block; width:150px; height:150px; box-shadow:0 0 0 7px var(--tinta), 10px 12px 0 7px rgba(28,42,107,.22)">${avatar(150)}</span>`, f);
  const b3 = h("div", "position:absolute; left:70px; top:822px; font-weight:800; font-size:96px; line-height:.92; color:var(--tinta)", nomeMarca().replace(" ", "<br>"), f);
  T.persFim = personagem(f, 570, 620, 900, [[-10, "rindo"]], { fase: 2 });
  T.fimBlocos = [b1, b2, b3];
}
// capa do Instagram (render com t < 0): título grande, cachorro farejando bem ao lado da bolinha vermelha, personagem surpreso
function montarCapa() {
  const k = document.getElementById("capa");
  h("div", "position:absolute; inset:0; background:radial-gradient(1000px 1000px at 50% 42%, #A6E0FF 0%, #74CCFF 55%, #49B4F2 100%)", "", k);
  const rs = svg("svg", { width: 1080, height: 1920, viewBox: "0 0 1080 1920" }, k); rs.style.cssText = "position:absolute; left:0; top:0";
  for (let i = 0; i < 18; i++) { const a0 = (i / 18) * 2 * Math.PI + 0.1, a1 = a0 + Math.PI / 18;
    svg("path", { d: `M540 1000 L${(540 + 2200 * Math.cos(a0)).toFixed(1)} ${(1000 + 2200 * Math.sin(a0)).toFixed(1)} L${(540 + 2200 * Math.cos(a1)).toFixed(1)} ${(1000 + 2200 * Math.sin(a1)).toFixed(1)} Z`, fill: "rgba(255,255,255,.18)" }, rs); }
  h("div", "position:absolute; left:0; right:0; top:300px; text-align:center; font-weight:800; line-height:.88; letter-spacing:-2px; color:var(--tinta)",
    `<div style="font-size:138px">POR QUE ELE</div><div class="sombra" style="font-size:210px; color:var(--verm); text-shadow:8px 9px 0 var(--tinta)">NÃO VÊ?</div>`, k);
  const card = h("div", "left:60px; top:720px; width:960px; height:620px", "", k, "cartao");
  const BX = 430, BY = 470, RB = 60;
  const j = jardim(card, 960, 620, { hz: 170, seed: 9, camadas: [430, BY + RB * 0.7], tufos: [[BX, BY + RB * 0.75, 12]], escLam: 1.1, escTufo: 0.75 });
  svg("ellipse", { cx: BX, cy: BY + RB - 5, rx: RB, ry: 12, fill: "rgba(0,0,0,.25)" }, j.camadas[1]);
  bola(j.camadas[1], RB, VERM).g.setAttribute("transform", `translate(${BX},${BY})`);
  const cao = cachorro(j.camadas[0]);
  const ov = svg("svg", { width: 960, height: 620, viewBox: "0 0 960 620" }, card); ov.style.cssText = "position:absolute; left:0; top:0";
  const an = anel(ov, BX, BY, 92); an.setAttribute("opacity", 1);
  anim((t) => { if (t >= 0) return; cao.pose({ t: 0, x: 720, y: 440, esc: 1.15, face: -1, cabeca: 20, pergunta: 1, olhar: 3, cauda: 10 }); });
  const z = personagem(k, -30, 1010, 720, [[-10, "surpreso"]]);
  h("div", "position:absolute; left:400px; top:1395px", `<span class="chip azul" style="font-size:46px; height:84px; padding:10px 34px 0 10px"><span class="av" style="width:66px; height:66px; margin-top:-8px; box-shadow:0 0 0 4px var(--fundo)">${avatar(66)}</span>${nomeMarca()}</span>`, k);
  T.capaZe = z;
}

// ======================================================================= iniciar e desenhar
async function iniciar(tl) {
  TL = tl; DADOS = tl.dados || {}; TL.cenas.forEach((c) => { C[c.cena] = c; });
  try { await Promise.all(["800 40px 'Baloo 2'", "700 40px 'Baloo 2'"].map((f) => document.fonts.load(f))); } catch (e) { }
  await document.fonts.ready;
  if (!document.fonts.check("800 40px 'Baloo 2'")) console.warn("fonte não carregou: Baloo 2");
  montarFundo();
  document.getElementById("marcaAv").innerHTML = avatar(64); document.getElementById("marcaNome").textContent = nomeMarca();
  const pai = document.getElementById("cenas");
  TL.cenas.forEach((c, i) => { const raiz = h("div", "", "", pai, "cena"); MONTA[c.cena](raiz, c);
    const tIn = i === 0 ? -10 : c.ini - 0.28; CENAS.push({ c, raiz, tIn }); if (i > 0) som(tIn, "whoosh", { dur: 0.4, vol: 0.24 }); });
  CENAS.forEach((k, i) => { k.tOut = CENAS[i + 1] ? CENAS[i + 1].tIn : 1e9; });
  const ult = TL.cenas[TL.cenas.length - 1]; T.fim = ult.ini + ult.dur + 0.35;
  montarLegendas(); montarFim(); montarCapa();
  som(T.fim + 0.15, "whoosh", { dur: 0.45, vol: 0.3 }); som(T.fim + 0.55, "plim", { nota: 84, vol: 0.4 }); som(T.fim + 0.75, "plim", { nota: 91, vol: 0.4 });
  await Promise.all([...document.images].map((im) => im.decode().catch(() => console.warn("imagem não carregou: " + im.src))));
  EVENTOS.sort((a, b) => a.t - b.t);
  await render(0);
  return EVENTOS;
}

async function render(t) {
  const capa = t < 0;
  document.getElementById("capa").style.display = capa ? "block" : "none";
  ["cenas", "leg", "fim", "marca"].forEach((id) => { document.getElementById(id).style.display = capa ? "none" : ""; });
  T.raios.setAttribute("transform", `rotate(${(t * 3.5).toFixed(2)} 540 900)`);
  T.pontos.style.transform = `translate(${(frac(t * 0.3) * 34).toFixed(1)}px, ${(frac(t * 0.2) * 34).toFixed(1)}px)`;
  const qf = clamp((t - T.fim) / 0.45);
  CENAS.forEach((k, i) => {
    const ultima = i === CENAS.length - 1;
    const pe = k.tIn < 0 ? 1 : clamp((t - k.tIn) / 0.45), px = ultima ? qf : clamp((t - k.tOut) / 0.34);
    if (capa || pe <= 0 || px >= 1) { k.raiz.style.visibility = "hidden"; return; }
    k.raiz.style.visibility = "visible";
    const ee = easeOut(pe), ex = easeIO(px);
    const kb = 1 + 0.03 * clamp((t - Math.max(0, k.tIn)) / Math.max(3, k.c.dur + 1));      // câmera sempre andando
    k.raiz.style.opacity = (Math.min(1, pe * 1.6) * (1 - ex)).toFixed(3);
    k.raiz.style.transform = `translate(${(6 * Math.sin(t * 0.6 + i) - 90 * ex).toFixed(2)}px, ${(70 * (1 - ee)).toFixed(1)}px) scale(${(kb * (0.96 + 0.04 * ee)).toFixed(4)})`;
    const b = 9 * (1 - ee) + 8 * ex; k.raiz.style.filter = b > 0.2 ? `blur(${b.toFixed(2)}px)` : "none";
  });
  for (const f of A) f(t);
  T.marca.style.opacity = (1 - qf).toFixed(3);
  T.marca.style.transform = `translateY(${(3 * Math.sin(t * 1.3)).toFixed(1)}px)`;
  LEG.forEach((b) => { if (t < b.ini || t >= b.fim || t >= T.fim) { b.g.style.opacity = 0; return; }
    b.g.style.opacity = 1; b.cx.style.transform = `scale(${(0.88 + 0.12 * volta(clamp((t - b.ini) / 0.22))).toFixed(3)})`;
    let ativa = -1; b.spans.forEach((s, i) => { if (s.w.t <= t + 0.03) ativa = i; });
    b.spans.forEach((s, i) => { const q = clamp((t - s.w.t + 0.03) / 0.12); s.sp.style.opacity = (0.45 + 0.55 * q).toFixed(3);
      s.sp.classList.toggle("agora", i === ativa && !s.cor); s.sp.style.transform = i === ativa ? "scale(1.04)" : ""; }); });
  const f = document.getElementById("fim"); f.style.opacity = qf.toFixed(3);
  T.fimBlocos.forEach((b, i) => { const q = easeOut(clamp((t - T.fim - 0.1 - i * 0.12) / 0.45)); b.style.opacity = q.toFixed(3);
    b.style.transform = `translate(${(4 * Math.sin(t * 0.8 + i)).toFixed(2)}px, ${(34 * (1 - q) + 4 * Math.sin(t * 1.2 + i)).toFixed(2)}px)`; });
  T.persFim.caixa.style.transform = `translateX(${(180 * (1 - easeOut(clamp((t - T.fim - 0.2) / 0.5)))).toFixed(1)}px)`;
}
